[project]
name = "ragintra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "cleanpy>=0.5.1",
    "fastapi[standard]>=0.162.0",
    "fire>=0.7.1",
    "flake8>=7.4.1",
    "langchain-text-splitters>=1.1.3",
    "mypy>=2.4.0",
    "nltk==3.9.1",
    "numpy>=2.2.6",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]
[tool.fastapi]
entrypoint = "src.app:app"
[tool.mypy]
disable_error_code = ["import-untyped"]
